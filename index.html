<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog preview card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="background">
            <div class="layout">
                <div class="image">
                    <img src="images/illustration-article.svg" alt="illustration">
                </div>
                <div class="text">
                    <button class="learn" type="submit">Learning</button>
                    <p class="date">Published 21 Dec 2023</p>
                    <h1 class="title"> HTML & CSS foundations</h1>
                    <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
                </div>
                <div class="creator">
                    <div class="face">
                     <img src="images/image-avatar.webp" alt="Greg">
                    </div>
                    <div class="name">
                     <h1>Greg Hooper</h1>
                    </div>
                </div>

            </div>
        </div>
    </main>
    
</body>
</html>
